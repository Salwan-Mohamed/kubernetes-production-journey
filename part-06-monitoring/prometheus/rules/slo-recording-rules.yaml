# SLO Recording Rules for Healthcare Platform
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: slo-recording-rules
  namespace: monitoring
  labels:
    prometheus: kube-prometheus
    role: alert-rules
spec:
  groups:
    - name: slo.rules
      interval: 30s
      rules:
        # Availability SLI - Success rate
        - record: sli:availability:ratio
          expr: |
            sum(rate(http_requests_total{status=~"2..|3..",job="patient-api"}[5m]))
            /
            sum(rate(http_requests_total{job="patient-api"}[5m]))
        
        # 30-day availability
        - record: slo:availability:30d
          expr: avg_over_time(sli:availability:ratio[30d])
        
        # Error budget remaining (0-1, where 1 = all budget left)
        - record: slo:availability:error_budget_remaining
          expr: |
            (1 - ((1 - slo:availability:30d) / (1 - 0.999)))
        
        # Burn rate - how fast we're consuming error budget
        - record: slo:availability:burn_rate:5m
          expr: |
            (1 - sli:availability:ratio) / (1 - 0.999)
        
        - record: slo:availability:burn_rate:1h
          expr: |
            (1 - avg_over_time(sli:availability:ratio[1h])) / (1 - 0.999)
        
        # Latency SLI - p95 latency
        - record: sli:latency:p95
          expr: |
            histogram_quantile(0.95,
              sum(rate(http_request_duration_seconds_bucket{job="patient-api"}[5m])) by (le)
            )
        
        # Latency SLI - p99 latency
        - record: sli:latency:p99
          expr: |
            histogram_quantile(0.99,
              sum(rate(http_request_duration_seconds_bucket{job="patient-api"}[5m])) by (le)
            )
        
        # Latency SLO compliance (% of requests < 500ms)
        - record: slo:latency:compliance
          expr: |
            sum(rate(http_request_duration_seconds_bucket{le="0.5",job="patient-api"}[5m]))
            /
            sum(rate(http_request_duration_seconds_count{job="patient-api"}[5m]))
        
        # Error rate
        - record: sli:error_rate:ratio
          expr: |
            sum(rate(http_requests_total{status=~"5..",job="patient-api"}[5m]))
            /
            sum(rate(http_requests_total{job="patient-api"}[5m]))
        
        # Request rate (requests per second)
        - record: job:http_requests:rate5m
          expr: |
            sum(rate(http_requests_total{job="patient-api"}[5m])) by (job)
        
        # Resource utilization - CPU
        - record: namespace:container_cpu_usage:sum
          expr: |
            sum(rate(container_cpu_usage_seconds_total{namespace="healthcare"}[5m])) by (namespace, pod)
        
        # Resource utilization - Memory
        - record: namespace:container_memory_usage:sum
          expr: |
            sum(container_memory_working_set_bytes{namespace="healthcare"}) by (namespace, pod)
        
        # Database connection pool utilization
        - record: db:connection_pool:utilization
          expr: |
            hikaricp_connections_active{namespace="healthcare"}
            /
            hikaricp_connections_max{namespace="healthcare"}
        
        # Pod restart rate
        - record: namespace:pod_restarts:rate5m
          expr: |
            rate(kube_pod_container_status_restarts_total{namespace="healthcare"}[5m])
        
        # Network traffic - ingress
        - record: namespace:network_receive_bytes:rate5m
          expr: |
            sum(rate(container_network_receive_bytes_total{namespace="healthcare"}[5m])) by (namespace, pod)
        
        # Network traffic - egress
        - record: namespace:network_transmit_bytes:rate5m
          expr: |
            sum(rate(container_network_transmit_bytes_total{namespace="healthcare"}[5m])) by (namespace, pod)